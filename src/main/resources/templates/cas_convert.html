<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FriendFinderSFU | Convert to CAS Account</title>

  <!-- Google Font: Source Sans Pro -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Source+Sans+Pro:300,400,400i,700&display=fallback">
  <!-- Font Awesome -->
  <link rel="stylesheet" href="/alte/plugins/fontawesome-free/css/all.min.css">
  <!-- Theme style -->
  <link rel="stylesheet" href="/alte/dist/css/adminlte.min.css">
</head>
<body class="hold-transition lockscreen">
<!-- Automatic element centering -->
<div class="lockscreen-wrapper">
  <div class="lockscreen-logo">
    <a href="#"><b>FrinedFinder</b>SFU</a>
    
  </div>
  <div th:if="${param.error}" class="alert alert-danger text-center">
        Incorrect Password
      </div>
  <!-- User name -->
  <div class="lockscreen-name">Convert to CAS Account</div>
  

  <!-- START LOCK SCREEN ITEM -->
  <div class="lockscreen-item">
    <!-- lockscreen image -->
    <!-- /.lockscreen-image -->

    <!-- lockscreen credentials (contains the form) -->
    <form class="lockscreen-credentials" action="/cas/convert" method="post">
      <div class="input-group">
        <input name="password" type="password" class="form-control" placeholder="password">

        <div class="input-group-append">
          <button type="submit" class="btn">
            <i class="fas fa-arrow-right text-muted"></i>
          </button>
        </div>
      </div>
    </form>
    <!-- /.lockscreen credentials -->

  </div>
  <!-- /.lockscreen-item -->
  <div class="help-block text-center">
    Enter your password to convert your account to a CAS account. <b>This irreversibly disables your password and allows you to log in with CAS instead.</b>
  </div>
  <div class="text-center">
    <a href="/login">Cancel and go to Login</a>
  </div>
</div>
<!-- /.center -->

<!-- jQuery -->
<script src="/alte/plugins/jquery/jquery.min.js"></script>
<!-- Bootstrap 4 -->
<script src="/alte/plugins/bootstrap/js/bootstrap.bundle.min.js"></script>
</body>
</html>
