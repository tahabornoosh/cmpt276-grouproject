<th:block th:replace="~{fragments/layout :: head('Edit User')}"></th:block>
<th:block th:replace="~{fragments/layout :: bodyStart}"></th:block>
<input type="hidden" id="activeMenuItem" name="activeMenuItem" value="none" />

<main class="content-wrapper">
  <section class="content-header">
    <div class="container-fluid">
      <div class="row mb-2">
        <div class="col-sm-6"><h1>Edit User Account: <span th:text="${user.first_name}"></span> <span th:text="${user.last_name}"></span></h1></div>
      </div>
    </div>
  </section>

  <section class="content">
    <div class="container-fluid">
        <div class="card">
            <div class="card card-primary card-outline mb-4">
                  <div class="card-header">
                    <div class="card-title">Edit User</div>
                    <div hidden class="alert alert-success" id="success">Success!</div>
                    <div hidden class="alert alert-danger" id="error">Your input is invalid. Please try again.</div>
                    <script>
                        const urlParams = new URLSearchParams(window.location.search);

                        const err = urlParams.get('error');
                        const avatarErr = urlParams.get('avatarError');
                        const succ = urlParams.get('success');

                        if (err == "1") {
                            document.getElementById("error").hidden = false;
                        } else if (avatarErr == "1") {
                            const errorBox = document.getElementById("error");
                            errorBox.textContent =
                                "Avatar must be a valid PNG or JPEG image under 2 MB.";
                            errorBox.hidden = false;
                        } else if (succ == "1") {
                            document.getElementById("success").hidden = false;
                        }

                        if (err || avatarErr || succ) {
                            history.replaceState(
                                {},
                                "",
                                window.location.pathname
                            );
                        }
                    </script>
                  </div>
                  <form th:action="@{/account/edit/{id}(id=${user.id})}"
                          th:object="${user}"
                          method="POST"
                          enctype="multipart/form-data">
                    <div class="card-body">
                      <div class="mb-3">
                        <label for="firstname" class="form-label">First Name</label>
                        <input th:field="*{first_name}" type="text" class="form-control" id="firstname" aria-describedby="firstname">
                      </div>

                        <div class="mb-3">
                        <label for="lastname" class="form-label">Last Name</label>
                        <input th:field="*{last_name}" type="text" class="form-control" id="lastname" aria-describedby="lastname">
                      </div>

                      <div class="mb-3">
                        <label class="form-label" for="select-default">Gender</label>

                        <select class="form-control" id="select-default"
                                th:field="*{gender}">
                            <option th:each="r : ${genders}"
                                    th:value="${r}"
                                    th:text="${r}">
                            </option>
                        </select>
                    </div>


                        <div class="mb-3">
                          <label for="bio" class="form-label">Bio</label>
                          <textarea th:field="*{bio}"
                                    class="form-control"
                                    id="bio"
                                    rows="4"
                                    maxlength="500"
                                    placeholder="Tell other students about yourself"></textarea>
                          <small class="form-text text-muted">
                            Maximum 500 characters.
                          </small>
                        </div>

                        <div class="mb-3">
                          <label class="form-label">Current Avatar</label>
                          <div>
                            <img th:src="${user.avatar}"
                                 src="/user.png"
                                 alt="Current avatar"
                                 class="img-circle"
                                 width="100"
                                 height="100"
                                 style="object-fit: cover;">
                          </div>
                        </div>

                        <div class="mb-3">
                          <label for="avatarFile" class="form-label">
                            Upload New Avatar
                          </label>
                          <input type="file"
                                 class="form-control"
                                 id="avatarFile"
                                 name="avatarFile"
                                 accept="image/png,image/jpeg">
                          <small class="form-text text-muted">
                            PNG or JPEG only. Maximum size: 2 MB.
                          </small>
                        </div>

                        <div class="form-check mb-3">
                          <input class="form-check-input"
                                 type="checkbox"
                                 id="removeAvatar"
                                 name="removeAvatar"
                                 value="true">
                          <label class="form-check-label" for="removeAvatar">
                            Remove avatar and use the default picture
                          </label>
                        </div>

                        <div class="mb-3">
                          <label for="password" class="form-label">
                            Password (leave empty to not change)
                          </label>
                          <input th:field="*{password}"
                                 type="password"
                                 class="form-control"
                                 id="password">
                        </div>
                    
                    <div class="card-footer">
                      <button type="submit" class="btn btn-primary">Submit</button>
                    </div>
                  </form>
                </div>
        </div>
    </div>
  </section>

  <script>
    document.addEventListener('DOMContentLoaded', function () {
      if (window.jQuery && window.jQuery.fn.DataTable) {
        $('#usersTable').DataTable({ responsive: true, lengthChange: false, autoWidth: false });
      }
    });
  </script>
</main>

<th:block th:replace="~{fragments/layout :: bodyEnd}"></th:block>
